name: Download photo candidates (temporary)
on:
  push:
    branches: [photo-candidates]
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p candidates
          for id in 20855836 16706765 2199293 16325212; do
            curl -fsSL "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=1600" -o "candidates/px-$id.jpg" || echo "fail $id"
          done
          ls -la candidates
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add candidates; git commit -m "Photo candidates" || true; git push
