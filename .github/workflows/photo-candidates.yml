name: Download photo candidates (temporary)
on:
  push:
    branches: [photo-candidates]
permissions:
  contents: write
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p candidates
          for slug in a-truck-on-a-road-CtFk1YWtbyw a-large-truck-on-the-road-N5EPfCrEuy8 a-red-semi-truck-cab-without-a-trailer-pAV_Y7DBOSg a-large-yellow-truck-Vef2nQBfVww; do
            id=${slug##*-}
            img=$(curl -fsSL -A "Mozilla/5.0" "https://unsplash.com/photos/$slug" | grep -oE 'https://images\.unsplash\.com/photo-[a-zA-Z0-9_-]+' | head -1)
            echo "$id -> $img"
            [ -n "$img" ] && curl -fsSL "$img?fm=jpg&q=80&w=1600&fit=crop" -o "candidates/$id.jpg" || echo "fail $id"
            echo "$id $img" >> candidates/ids.txt
          done
          ls -la candidates
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add candidates; git commit -m "Photo candidates" || true; git push
