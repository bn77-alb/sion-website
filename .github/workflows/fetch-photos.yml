name: Fetch photos into branch (temporary)
on:
  push:
    branches: [website-v2-1]
    paths: ['.github/workflows/fetch-photos.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/fetch-photos.sh && ls -la src/assets/images
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add src/assets/images
          git commit -m "Add Paketzusteller and Reinigung photos (Unsplash License)" || echo "nothing to commit"
          git push
